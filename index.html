<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive Optimist prototype with project chats and pinned threads.">
  <title>Optimist Agent Prototype</title>
  <link rel="icon" type="image/png" href="optimist-mark.png">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
<div id="opt-demo">
  <div class="body">
    <aside class="sidebar" aria-label="Workspace sidebar">
      <div class="sidebar-head"><button type="button" class="sidebar-search" data-action="search" aria-label="Search chats and projects"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg><span>Search</span></button><button type="button" class="quiet nav-control" data-action="nav" aria-expanded="true" aria-controls="op-nav" aria-label="Collapse sidebar" title="Collapse sidebar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button></div>
      <div class="icon-rail">
        <button type="button" class="quiet rail-projects" data-action="projects" aria-label="Open projects" title="Projects" aria-controls="op-nav" aria-expanded="false"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="7" r="3"/><circle cx="6" cy="17" r="3"/><path d="M13 7h8M13 17h8"/></svg></button>
        <div class="evolves-space" aria-label="Space for Evolves"></div>
        <button type="button" class="rail-profile" data-action="account" aria-label="Account" title="Account">RP</button>
      </div>
      <nav id="op-nav" class="nav" aria-label="Chats and threads"></nav>
    </aside>
    <main class="chat">
      <h1 class="chat-project-name" id="op-project-title"></h1>
      <div class="agent-presence" aria-label="Optimist">
        <span class="agent-logo" aria-hidden="true"></span>
        <span>Optimist</span>
      </div>
      <button type="button" class="panel-toggle" data-action="panel" aria-expanded="false" aria-controls="op-panel" aria-label="Open Optimist panel" title="Open Optimist panel">
        <svg class="chev-open" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        <svg class="chev-close" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <button type="button" class="edge-computer" data-action="computer" aria-label="Open My Optimist Computer" title="My Optimist Computer"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><circle cx="12" cy="11" r="4"/><path d="M8 22h8M12 18v4"/></svg><i aria-hidden="true"></i></button><div id="op-timeline" class="timeline" aria-label="Conversation history"><div id="op-messages" class="messages"></div></div>
      <form id="op-composer" class="composer row">
        <button type="button" class="composer-plus" data-action="attach" aria-label="Add an attachment" title="Add an attachment">
          <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <div class="composer-shell">
          <label for="op-draft" class="sr">Message</label>
          <textarea id="op-draft" rows="1" maxlength="1200" placeholder="Ask Optimist"></textarea>
          <div class="composer-actions">
            <button type="button" class="composer-icon emoji-button" data-action="emoji" aria-label="Add emoji" title="Add emoji"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="12" r="7.5"/><path d="M8.2 10h.01M13.8 10h.01M8.3 14.2c1.6 1.6 3.8 1.6 5.4 0M19 3v5M16.5 5.5h5"/></svg></button>
            <button type="button" class="composer-icon mic-button" data-action="voice" aria-label="Start voice input" title="Start voice input"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M8.5 21h7"/></svg></button>
          </div>
        </div>
        <button type="button" class="sr send-control" data-action="send" aria-label="Send message">Send</button>
      </form>
    </main>
    <aside id="op-panel" class="panel" aria-label="Optimist panel" hidden></aside>
  </div>
  <dialog id="op-dialog" aria-labelledby="op-dialog-heading"></dialog>
  <div id="op-announce" class="sr" role="status"></div>
</div>
</body>
</html>
